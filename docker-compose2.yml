version: '3'
services:
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "14268:14268"
      - "6832:6832"
      - "5775:5775/udp" 
      - "6831:6831/udp" 
      - "6832:6832/udp" 
      - "5778:5778" 
      - "9411:9411"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - LOG_LEVEL=debug
  # database_mysql:
  #   image: mysql:8.0
  #   cap_add:
  #     - SYS_NICE
  #   restart: always
  #   environment:
  #     - MYSQL_DATABASE=test
  #     - MYSQL_ROOT_PASSWORD=1234
  #   ports:
  #     - '3308:3306'
  #   volumes:
  #     - mysql:/var/lib/mysql
  #     - ./data/mydump.sql:/docker-entrypoint-initdb.d/mydump.sql
  database_postges:
    image: postgres:latest
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=abcd@1234
      - PGDATA=/data/postgres
      - POSTGRES_DB=ads_api
    ports:
      - '5433:5432'
    volumes:
       - pgsql:/data/postgres
  cache:
    image: redis:6.2-alpine
    restart: always
    ports:
      - '6379:6379'
    # command: redis-server --save 20 1 --loglevel warning --requirepass eYVX7EwVmmxKPCDmwMtyKVge8oLd2t81
    volumes: 
      - cache:/data
  # ads_api_app:
  #   build: .
  #   env_file:
  #     - .env
  #   ports: 
  #     - "8085:8085"
  zookeeper:
    image: wurstmeister/zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
  kafka:
    image: wurstmeister/kafka
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_HOST_NAME: localhost
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
volumes:
  mysql:
    driver: local
  pgsql:
    driver: local
  cache:
    driver: local



      
