      campaignId:
        type: string
      recommendationType:
        description: The bid recommendation type.
        type: string
      targetingExpressions:
        description: |-
          maxItems: 100
          example: List [ OrderedMap { "type": "CLOSE_MATCH" },
           OrderedMap { "type": "LOOSE_MATCH" }, OrderedMap
            { "type": "SUBSTITUTES" }, OrderedMap { "type": "COMPLEMENTS" } ]
          The list of targeting expressions. Maximum of 100 per request, use pagination for more if needed.
