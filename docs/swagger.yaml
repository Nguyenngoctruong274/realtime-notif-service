  awsrequest.ProductMetadataList:
    properties:
      adType:
        description: |-
          SP - Sponsored Product
          SB - Sponsored Brand
          SD - Sponsored Display
          Enum:
          [ SP, SB, SD ]
        type: string
      asins:
        description: string]
        items:
          type: string
        type: array
      checkEligibility:
        description: |-
          default: false
          Whether advertising eligibility info is required
        type: boolean
      checkItemDetails:
        description: |-
          default: false
          Whether item details such as name, image, and price is required
        type: boolean
      cursorToken:
        description: Pagination token used for the suggested sort type or for author
          merchant
        type: string
      locale:
        description: |-
          example: zh_CN
          Optional locale for detail and eligibility response strings. Default to the marketplace locale.
        type: string
      pageIndex:
        description: |-
          minimum: 0
          example: 0
          Index of the page to be returned; For author, this value will be ignored, should use cursorToken instead.
        type: integer
      pageSize:
        description: |-
          maximum: 300
          minimum: 1
          example: 5
          Number of items to be returned on this page index
        type: integer
      searchStr:
        description: |-
          example: jean
          Specific string in the item title to search for in the advertiser's inventory.
          Case insensitive. Cannot use together with asins or skus input types
        type: string
      skus:
        description: string]
        items:
          type: string
        type: array
      sortBy:
        description: |-
          SUGGESTED - Suggested products are those most
           likely to engage customers, and have a
           higher chance of generating clicks if advertised.
          CREATED_DATE - Date the item listing was created
          Enum:
          [ SUGGESTED, CREATED_DATE ]
        type: string
      sortOrder:
        description: |-
          ASC - Ascending, from A to Z
          DESC - Descending, from Z to A
          Enum:
          [ ASC, DESC ]
        type: string
    type: object
  awsrequest.RatingRange:
