  awsresponse.BasisPrice:
    properties:
      amount:
        description: |-
          example: 6.99
          Price amount
        type: number
      currency:
        description: |-
          example: USD
          Currency of the price
        type: string
    type: object
  awsresponse.BidInfo:
    properties:
      bid:
        type: number
      matchType:
        type: string
      rank:
        type: number
      suggestedBid:
        $ref: '#/definitions/awsresponse.BidValues'
      theme:
        type: string
    type: object
  awsresponse.BidRecommendationPerTargetingExpression:
    properties:
      bidValues:
        description: 'maxItems: 3'
        items:
          $ref: '#/definitions/awsresponse.BidValue'
        type: array
      targetingExpression:
        allOf:
        - $ref: '#/definitions/awsresponse.TargetingExpressionRecommend'
        description: |-
          The targeting expression. The type property specifies the targeting option.
           Use CLOSE_MATCH to match your auto targeting ads closely to the specified value.
           Use LOOSE_MATCH to match your auto targeting ads broadly to the specified value.
           Use SUBSTITUTES to display your auto targeting ads along with substitutable products.
           Use COMPLEMENTS to display your auto targeting ads along with affiliated products.
           Use KEYWORD_BROAD_MATCH to broadly match your keyword targeting ads with search queries.
           Use KEYWORD_EXACT_MATCH to exactly match your keyword targeting ads with search queries.
           Use KEYWORD_PHRASE_MATCH to match your keyword targeting ads with search phrases.
    type: object
  awsresponse.BidValue:
    properties:
      suggestedBid:
        description: Bid value of the bid recommendations
        type: number
    type: object
  awsresponse.BidValues:
