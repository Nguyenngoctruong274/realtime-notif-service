  awsresponse.Budget:
    properties:
      amount:
        description: The budget amount associated with the portfolio. Cannot be null.
        type: number
      currencyCode:
        description: "The currency used for all monetary values for entities under
          this profile. Cannot be null.\n\tEnum:\n[ USD, CAD, MXN, BRL, GBP, JPY,
          EUR, AUD, AED, SEK, PLN, SGD, TRY ]"
        type: string
      endDate:
        description: |-
          The end date after which the budget is no longer applied.
          Optional if policy is set to dateRange or monthlyRecurring.
        type: string
      policy:
        description: |-
          Enum:
          [ dateRange, monthlyRecurring ]
        type: string
      startDate:
        description: |-
          The starting date in YYYYMMDD format to which the budget is applied.
          Required if policy is set to dateRange.
          Not specified if policy is set to monthlyRecurring.
          Note that the starting date for monthlyRecurring is the date when the policy is set.
        type: string
    type: object
  awsresponse.CategoryItem:
